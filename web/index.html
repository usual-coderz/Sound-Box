<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b0f14"
    >

    <title>Sound Box</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">

            <h1>🎵 Sound Box</h1>

            <p>
                Tap a sound to play it in the VC
            </p>

        </header>


        <!-- Search -->
        <div class="search-box">

            <input
                id="search"
                type="search"
                placeholder="Search sounds..."
                autocomplete="off"
            >

        </div>


        <!-- Sounds -->
        <section id="sounds">

            <div class="loading">
                Loading sounds...
            </div>

        </section>

    </main>


    <!-- Toast -->
    <div
        id="toast"
        class="toast"
    ></div>


    <script src="/static/app.js"></script>

</body>

</html>
